<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelulusan SMK Cordova</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #1e3a8a, #020617);
      transition: 0.5s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fadeUp {
      animation: fadeUp 1s ease forwards;
    }

    @keyframes floatLove {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
    }

    .love {
      position: fixed;
      bottom: 0;
      font-size: 20px;
      animation: floatLove 3s linear forwards;
    }
  </style>
</head>

<body class="text-white font-sans">

<div class="min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-3xl text-center animate-fadeUp">

<!-- LOGO -->
<div class="flex justify-center mb-4">
  <img src="logo.png" class="w-28 drop-shadow-[0_0_25px_rgba(59,130,246,0.7)]">
</div>

<h1 class="text-4xl md:text-6xl font-bold text-blue-300">SMK CORDOVA</h1>
<p class="text-gray-300 mt-2 mb-6">Pengumuman Kelulusan Tahun Ajaran 2026</p>

<div class="bg-white/10 backdrop-blur-xl border border-blue-400/20 p-8 rounded-3xl shadow-2xl">

<p class="text-blue-200 text-sm mb-4">Masukkan NIS untuk melihat hasil kelulusan</p>

<div class="flex gap-2 mb-6">
  <input id="nisn" type="text" placeholder="Masukkan NIS..." class="w-full px-4 py-3 rounded-xl text-black">
  <button onclick="cekKelulusan()" class="px-6 py-3 bg-blue-400 text-black rounded-xl font-semibold hover:scale-105 transition">
    Cek
  </button>
</div>

<div id="hasil" class="hidden mt-6">

<div class="grid md:grid-cols-2 gap-4 bg-black/40 rounded-xl p-6 border border-blue-300/20">

<div>
  <p class="text-gray-400 text-sm">Nama</p>
  <p id="nama" class="mb-3 text-lg font-semibold"></p>

  <p class="text-gray-400 text-sm">NIS</p>
  <p id="nisnText"></p>
</div>

<div>
  <p class="text-gray-400 text-sm">Status</p>
  <p id="status" class="text-2xl font-bold mb-3"></p>

  <p id="ucapan" class="text-blue-200 text-sm"></p>
</div>

</div>
</div>
</div>

<p class="text-gray-400 text-sm mt-6">
© 2026 SMK Cordova • Sistem Kelulusan Online
</p>

</div>
</div>

<script>
const data = [
  { nisn: "20234020", nama: "ALFIRA DINA AMARIYA", status: "LULUS" },
  { nisn: "20234013", nama: "SHINTA AYU KURNIA NINGRUM", status: "LULUS" },
  { nisn: "20234049", nama: "ZAKIYYA", status: "LULUS" },
  { nisn: "20234019", nama: "AJIB NOR ROHMAN", status: "LULUS" },
  { nisn: "20234000", nama: "INTAN AFIRA FEBRIANTI", status: "LULUS" },
  { nisn: "20234034", nama: "INTAN NUR AINI", status: "LULUS" },
  { nisn: "20234029", nama: "NUR SAFILA", status: "LULUS" },
  { nisn: "20234046", nama: "RIZKI RAHMAD HANI", status: "LULUS" },
  { nisn: "20234012", nama: "RISA AULIA", status: "LULUS" },
  { nisn: "20233983", nama: "AHMAD FAIRUZ QOLBI", status: "LULUS" },
  { nisn: "20233984", nama: "AHMAD MUWAFFAQ ZAINIL ASROR", status: "LULUS" },
  { nisn: "20234270", nama: "MUHAMMAD ISWAN", status: "LULUS" },
  { nisn: "20233987", nama: "ALIVIA PUTRI DWI RAHMANIA", status: "LULUS" },

  { nisn: "20234044", nama: "NOVYA LARASATI", status: "TIDAK LULUS" },

  { nisn: "20234032", nama: "FIRYAL NAILAL FARAH", status: "LULUS" },
  { nisn: "20232042", nama: "NAJMA LAILI MUFLIHAH", status: "LULUS" },
  { nisn: "20234033", nama: "INDAH SYAFA'ATUN NI'MAH", status: "LULUS" },
  { nisn: "202320234041", nama: "AMANAH BUNGA RAGIL LESTARI", status: "LULUS" },
  { nisn: "20233995", nama: "DWI LUTFIANA SARI", status: "LULUS" },
  { nisn: "20234039", nama: "MUHAMMAD HAIKAL ALIF MALIKI", status: "LULUS" },
  { nisn: "20233990", nama: "ANIQOH NISA'UL KHOIR", status: "LULUS" },
  { nisn: "20234610", nama: "MUHAMMAD NUR FAUZI", status: "LULUS" },
  { nisn: "20234002", nama: "KHILYATUZ ZAHRIYAH FIRDAUS", status: "LULUS" },
  { nisn: "20234006", nama: "MUHAMMAD KHOIRUZ ZAMZAMI", status: "LULUS" },
  { nisn: "20234045", nama: "RATU LIVIA RACHEL ANANDITA", status: "LULUS" },
  { nisn: "20234031", nama: "FAUZI FAIDULLAH ZIDAN ATTAUFIQI", status: "LULUS" },
  { nisn: "20234024", nama: "ARFIAN ZAHRIL HAKIM", status: "LULUS" },
  { nisn: "20234027", nama: "DIA AYU ASHIVA NURROHMA", status: "LULUS" },
  { nisn: "20234043", nama: "NEZA INDIRA PUTRI", status: "LULUS" },
  { nisn: "20234005", nama: "MUHAMMAD HAIDAR AZMI AL BIRRU", status: "LULUS" },
  { nisn: "20234003", nama: "MOH FABRIAN ZIDNI ZULFA", status: "LULUS" },
  { nisn: "20234025", nama: "BELICIA DEANA", status: "LULUS" },
  { nisn: "20234014", nama: "TIARA SANIA AGUSTIN", status: "LULUS" },
  { nisn: "20234018", nama: "AHMAD REZA ARDIYANSYAH", status: "LULUS" },
  { nisn: "20234030", nama: "FAREL ADHI FIRMANSYAH", status: "LULUS" },
  { nisn: "20234021", nama: "AMANAH BUNGA RAGIL LESTARI", status: "LULUS" }
];

function cekKelulusan() {
  const input = document.getElementById("nisn").value.trim();
  const siswa = data.find(s => s.nisn === input);

  if (siswa) {
    document.getElementById("nama").innerText = siswa.nama;
    document.getElementById("nisnText").innerText = siswa.nisn;

    const statusEl = document.getElementById("status");
    const ucapan = document.getElementById("ucapan");

    document.getElementById("hasil").classList.remove("hidden");

    if (siswa.status === "LULUS") {
      statusEl.innerText = "🎉 LULUS";
      statusEl.style.color = "#22c55e";

      ucapan.innerText =
        "Selamat! Kamu berhasil menyelesaikan pendidikan di SMK Cordova. Semoga sukses ke depannya!";

      document.body.style.background = "radial-gradient(circle at top, #1e3a8a, #020617)";

      const end = Date.now() + 3000;
      (function frame() {
        confetti({ particleCount: 5, spread: 70, origin: { y: 0.6 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      for (let i = 0; i < 25; i++) {
        const love = document.createElement("div");
        love.classList.add("love");
        love.innerHTML = "💙";
        love.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(love);
        setTimeout(() => love.remove(), 3000);
      }

    } else {
      statusEl.innerText = "❌ TIDAK LULUS";
      statusEl.style.color = "#ef4444";

      ucapan.innerText =
        "Hasil ini mungkin tidak sesuai harapan, tapi ini bukan akhir dari perjalananmu. Tetaplah kuat, bangkit, dan jangan pernah menyerah.";

      document.body.style.background = "radial-gradient(circle at top, #450a0a, #020617)";
    }

  } else {
    alert("NIS tidak ditemukan!");
  }
}
</script>

</body>
</html>
