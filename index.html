<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Movi — Dari Farel</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    color:white;
    background: linear-gradient(270deg,#12002f,#000,#2b0036);
    background-size:600% 600%;
    animation:bgMove 20s ease infinite;
}
@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* Particles */
.particle{
    position:absolute;
    width:4px;height:4px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:fall linear infinite;
}
@keyframes fall{
    to{transform:translateY(110vh);opacity:0}
}

/* Card */
.card{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) translateY(40px);
    opacity:0;
    background:rgba(255,255,255,.12);
    padding:40px;
    border-radius:30px;
    backdrop-filter:blur(18px);
    text-align:center;
    max-width:420px;
    animation:cardIn 2s ease forwards;
    z-index:3;
}
@keyframes cardIn{
    to{opacity:1;transform:translate(-50%,-50%)}
}

p{line-height:1.7;font-size:16px}

/* Buttons */
button{
    padding:14px 30px;
    border:none;
    border-radius:50px;
    font-size:16px;
    cursor:pointer;
}
.yes{
    background:linear-gradient(135deg,#ffd369,#ff9f43);
    color:#333;
    box-shadow:0 0 20px #ffd369;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{
    0%{box-shadow:0 0 10px #ffd369}
    50%{box-shadow:0 0 30px #ffd369}
    100%{box-shadow:0 0 10px #ffd369}
}
.no{
    background:#ff3b3b;
    color:white;
    position:absolute;
    animation:float 4s ease-in-out infinite;
}
@keyframes float{
    0%{transform:translate(0,0)}
    50%{transform:translate(40px,-30px)}
    100%{transform:translate(0,0)}
}

/* Love */
.love{
    position:absolute;
    font-size:18px;
    animation:loveUp 6s linear infinite;
    opacity:.6;
}
@keyframes loveUp{
    from{transform:translateY(100vh);opacity:0}
    30%{opacity:.8}
    to{transform:translateY(-10vh);opacity:0}
}

canvas{
    position:fixed;
    inset:0;
    z-index:1;
}

#musicBtn{
    position:fixed;
    bottom:20px;right:20px;
    background:rgba(255,255,255,.2);
    border-radius:50%;
    padding:14px;
    cursor:pointer;
    z-index:5;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/10/20/audio_f2c6c98c93.mp3" type="audio/mpeg">
</audio>
<div id="musicBtn" onclick="toggleMusic()">🎵</div>

<div class="card">
<h1>🎆 Happy New Year 🎆</h1>
<p>
Movi,<br><br>
Aku datang bukan membawa masa lalu,<br>
tapi niat yang lebih dewasa.<br><br>
Kalau aku masih orang yang sama,<br>
namun dengan versi yang lebih baik…<br><br>
Mau nggak kita mulai lagi?<br><br>
— <b>Farel</b>
</p>
<button class="yes" onclick="yesClick()">Aku Mau 💖</button>
</div>

<button class="no" id="noBtn">Masih Ragu 🙈</button>

<script>
/* MUSIC */
const music=document.getElementById("music");
function toggleMusic(){music.paused?music.play():music.pause()}

/* Particles */
for(let i=0;i<60;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=5+Math.random()*5+"s";
    p.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(p);
}

/* Love */
setInterval(()=>{
    const l=document.createElement("div");
    l.className="love";
    l.innerHTML="❤️";
    l.style.left=Math.random()*100+"vw";
    document.body.appendChild(l);
    setTimeout(()=>l.remove(),6000);
},1200);

/* NO button AI */
const noBtn=document.getElementById("noBtn");
let x=innerWidth/2+150,y=innerHeight/2+150;
noBtn.style.left=x+"px";noBtn.style.top=y+"px";
document.addEventListener("mousemove",e=>{
    const r=noBtn.getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2);
    const dy=e.clientY-(r.top+r.height/2);
    if(Math.hypot(dx,dy)<150){
        x+=dx>0?-40:40;
        y+=dy>0?-40:40;
        x=Math.max(0,Math.min(innerWidth-r.width,x));
        y=Math.max(0,Math.min(innerHeight-r.height,y));
        noBtn.style.left=x+"px";
        noBtn.style.top=y+"px";
    }
});

/* YES */
function yesClick(){
document.body.innerHTML=`
<div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;">
<div>
<h1>🥹❤️</h1>
<p style="font-size:18px;line-height:1.7;">
Makasih, Movi.<br>
Tahun ini bukan mengulang,<br>
tapi melanjutkan 🤍<br><br>
— Farel
</p>
<h2>✨ Happy New Year ✨</h2>
</div>
</div>`;
}

/* FIREWORKS */
const c=document.getElementById("fireworks");
const ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let parts=[];
function boom(){
const x=Math.random()*c.width,y=Math.random()*c.height/2;
const col=["#ff7675","#74b9ff","#ffeaa7","#fd79a8","#55efc4"];
for(let i=0;i<90;i++){
parts.push({x,y,a:Math.random()*Math.PI*2,s:Math.random()*6+2,l:90,c:col[Math.floor(Math.random()*col.length)]});
}}
function draw(){
ctx.clearRect(0,0,c.width,c.height);
parts.forEach((p,i)=>{
p.x+=Math.cos(p.a)*p.s;
p.y+=Math.sin(p.a)*p.s;
p.l--;
ctx.fillStyle=p.c;
ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
if(p.l<=0)parts.splice(i,1);
});
requestAnimationFrame(draw);
}
setInterval(boom,800);
draw();
</script>

</body>
</html>
